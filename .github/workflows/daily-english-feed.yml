name: Audio Visual English - Daily AI Feed & Deploy to GitHub Pages

on:
  schedule:
    # 23:00 UTC hàng ngày = 06:00 AM giờ Việt Nam (UTC+7)
    - cron: '0 23 * * *'
  # Cho phép bấm nút "Run workflow" thủ công trên GitHub bất cứ lúc nào
  workflow_dispatch:
  # Tự động triển khai lại khi có commit mới đẩy lên nhánh chính
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-daily-feed:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🧠 Run Gemini AI Daily Lesson Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python LEARN/scripts/generate_daily_feed.py

      - name: 🚀 Commit & Push Updated Daily Feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add LEARN/daily_feed.json
          # Chỉ commit khi có sự thay đổi mới trong file
          if git diff --staged --quiet; then
            echo "ℹ️ Không có thay đổi mới trong daily_feed.json."
          else
            git commit -m "🤖 [Automated] Update Daily AV English Feed - $(date +'%Y-%m-%d')"
            git push
            echo "✅ Đã tự động đẩy bài học mới lên GitHub Repository!"
          fi

  deploy-to-github-pages:
    needs: generate-daily-feed
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository (Latest)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 🔧 Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🌐 Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
