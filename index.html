<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Visual English - By Chí Cường</title>
  <meta http-equiv="refresh" content="0; url=LEARN/ENGLISH_AV_TRAINER.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0a0d14;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(6, 182, 212, 0.2);
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
  <script>
    window.location.replace("LEARN/ENGLISH_AV_TRAINER.html");
  </script>
</head>
<body>
  <div class="loader"></div>
  <h2>AUDIO VISUAL ENGLISH • BY CHÍ CƯỜNG</h2>
  <p>Đang chuyển hướng tới ứng dụng luyện tiếng Anh... <br>Nếu trình duyệt không tự chuyển, <a href="LEARN/ENGLISH_AV_TRAINER.html">bấm vào đây</a>.</p>
</body>
</html>
